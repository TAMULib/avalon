volumes:
  npms:
services:
  db:
    container_name: ${POSTGRES_CONTAINER_NAME} 
    image: avalonmediasystem/db:fedora4
    build: ./db
    volumes:
      - ./data/database:/data   
      - ./data:/mnt/data   
      - D:/Data/avalon_code:/home/app/avalon
    environment:
      - AVALON_DB_PASSWORD=${AVALON_DB_PASSWORD}
      - AVALON_DB_USER=${AVALON_DB_USER}      
      - FEDORA_DB_PASSWORD=${FEDORA_DB_PASSWORD}
      - FEDORA_DB_USER=${FEDORA_DB_USER}      
      - PGDATA=/data
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    ports:
       - "5433:5432"  
  fedora:
    container_name: ${FEDORA_CONTAINER_NAME} 
    image: avalonmediasystem/fedora:4.7.5
    build:
      context: ./fedora
      args:
        - FEDORA_VERSION=4.7.5
    environment:
      - FEDORA_DB_PASSWORD=${FEDORA_DB_PASSWORD}
      - JAVA_OPTIONS=-Dfcrepo.postgresql.password=${FEDORA_DB_PASSWORD} -Dfcrepo.postgresql.username=fedora -Dfcrepo.postgresql.host=db -Dfcrepo.modeshape.configuration=classpath:/config/jdbc-postgresql/repository.json -Dfcrepo.home=/data
    depends_on:
      - db
    volumes:
      - ./data/fedora:/data
    ports:
       - "8080:8080"  
  solr:
    container_name: ${SOLR_CONTAINER_NAME}    
    image: avalonmediasystem/solr:latest
    build:
      context: ./solr
      args:
        - TAMU_AVALON_BRANCH=${AVALON_BRANCH}
        - TAMU_AVALON_REPO=${AVALON_REPO}
        - TAMU_AVALON_REPO_RAW=${AVALON_REPO_RAW}
    volumes:
      - ./data/solr:/opt/solr/server/solr/mycores      
    entrypoint:
      - docker-entrypoint.sh
      - solr-precreate
      - avalon
      - /opt/solr/avalon_conf
    ports:
       - "8983:8983"  
  hls:
    container_name: ${NGINX_CONTAINER_NAME}   
    hostname: localhost:8880
    image: ${VIC_SERVER}/avalon/nginx:${RANCHER_IMAGE_VERSION}
    build:
      context: ./nginx
    volumes:
      - ./data/masterfiles:/mnt/avalon/masterfiles  
    environment:
      - env_kaltura_streaming_port=${KALTURA_STREAMING_PORT}
      - env_rtmp_avalon_url=${RTMP_AVALON_URL}
      - env_master_file_location=${MASTER_FILE_LOCATION}
      - env_proxy_pass_url=${PROXY_PASS_URL}
      - env_resolver_ip=${RESOLVER_IP} 
      - env_auth_request_line=${AUTH_REQUEST_LINE}      
    ports:
       - "8880:8880"
  redis:
    container_name: ${REDIS_CONTAINER_NAME} 
    image: redis:alpine
  avalon: &avalon
    container_name: ${AVALON_CONTAINER_NAME} 
    image: ${VIC_SERVER}/avalon/${AVALON_CONTAINER_NAME}:${RANCHER_IMAGE_VERSION}
    build:
      context: .
    command: bash -c "/home/app/avalon/docker_init.sh && bundle exec rails server -b 0.0.0.0"
    depends_on:
      - db
      - fedora
      - solr
      - redis
      - hls
    environment:
      - INITIAL_USER=dhahn@tamu.edu
      - APP_NAME=avalon
      - BUNDLE_FLAGS=--with development postgres --without production test
      - ENCODE_WORK_DIR=/mnt/avalon/masterfiles
      - CONTROLLED_VOCABULARY=config/controlled_vocabulary.yml
      - DATABASE_URL=${DATABASE_URL}
      - DATABASE_CLEANER_ALLOW_REMOTE_DATABASE_URL=true
      - FEDORA_BASE_PATH=${FEDORA_BASE_PATH}
      - FEDORA_NAMESPACE=${FEDORA_NAMESPACE}
      - FEDORA_URL=${FEDORA_URL}
      - RAILS_ENV=production
      - RAILS_ADDITIONAL_HOSTS=${NGINX_CONTAINER_NAME}
      - RAILS_SERVE_STATIC_FILES=true       
      - SETTINGS__REDIS__HOST=redis
      - SETTINGS__REDIS__PORT=6379
      - SECRET_KEY_BASE=${SECRET_KEY_BASE}
      - SOLR_HOST=${SOLR_HOST}
      - SOLR_PORT=${SOLR_PORT}
      - SOLR_URL=${SOLR_URL}
      - AWS_REGION=us-east-1
      - MASTER_FILE_PATH
      - MASTER_FILE_STRATEGY=delete
      - MAXIMUM_UPLOAD_SIZE=4294967296
      - SETTINGS__FFMPEG__PATH=/usr/bin/ffmpeg
      - SYSTEM_GROUPS=administrator,group_manager,manager
      - env_rails_hosts=${AVALON_HOSTNAME}
      - env_redis_host=${REDIS_HOST}   
      - env_redis_port=6379        
      - env_avalon_hostname=${AVALON_HOSTNAME}
      - env_avalon_port=3000
      - env_avalon_protocol=http
      - env_dropbox_path=/mnt/avalon/dropbox
      - env_dropbox_upload_uri=\\cifs.library.tamu.edu/avalon/dropbox/
      - env_encoding_working_file_path=/mnt/avalon/ingest  
      - env_email_comments=${EMAIL_COMMENTS} 
      - env_email_notification=${EMAIL_NOTIFICATION} 
      - env_email_support=${EMAIL_SUPPORT} 
      - env_timeliner_url=http://${AVALON_HOSTNAME}:80/timeliner      
      - env_streaming_http_base=http://${KALTURA_HOSTNAME}:8880/avalon
      - env_streaming_rtmp_base=rtmp://${KALTURA_HOSTNAME}:8880/avalon
      - env_streaming_content_path=/mnt/avalon/masterfiles  
      - env_initial_user=${INITIAL_USER}
      - env_kaltura_hostname=${KALTURA_HOSTNAME}            
    volumes:
      - D:/Data/avalon_code:/home/app/avalon
      - npms:/home/app/avalon/node_modules
      - ./data/masterfiles:/mnt/avalon/masterfiles
      - ./data/dropbox:/mnt/avalon/dropbox   
      - ./data/ingest:/mnt/avalon/ingest         
      - ./data/gems:/gems        
      - ./data:/mnt/data
    ports:
      - '3000:3000'
    stdin_open: true
    tty: true
  worker:
    <<: *avalon
    container_name: ${AVALON_CONTAINER_NAME}-worker 
    command: dumb-init -- bash -c "bundle install && bundle exec sidekiq -C config/sidekiq.yml"
    ports: []    
    volumes:
      - ./data/masterfiles:/mnt/avalon/masterfiles
      - ./data/dropbox:/mnt/avalon/dropbox   
      - ./data/ingest:/mnt/avalon/ingest         
      - ./data/gems:/gems  
      - D:/Data/avalon_code:/home/app/avalon  
